[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "supermarket-bot"
version = "0.1.0"
description = "Read-only market-data bot for the Super Market (Susquehanna Predictions Cup) API"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["httpx>=0.25"]

[project.optional-dependencies]
realtime = ["realtime>=2.4,<3"]
dev = ["pytest>=7", "websockets>=12", "realtime>=2.4,<3"]

[project.scripts]
supermarket-bot = "supermarket_bot.cli:main"

[tool.setuptools]
packages = ["supermarket_bot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
